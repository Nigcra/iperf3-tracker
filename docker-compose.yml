# iperf3-Tracker: ein Container mit API und Oberfläche unter http://<host>:8000
# Start: docker compose up -d --build
# Noch nicht unter Docker getestet (Stand: Go-Portierung, Phase 10).

services:
  iperf3-tracker:
    build:
      context: .
      args:
        BUILD_DATE: docker
    container_name: iperf3-tracker
    ports:
      - "8000:8000"
    volumes:
      # config.yaml (inkl. Token-Schlüssel) und Datenbank
      - iperf-data:/data
    environment:
      - TZ=Europe/Berlin
      - SCHEDULER_ENABLED=true
      - LOG_LEVEL=info
    restart: unless-stopped

volumes:
  iperf-data:
